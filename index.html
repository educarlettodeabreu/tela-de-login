<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tela de login</title>
     <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>
                    Seja bem-vindo(a) novamente.
                    Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.
                </p>
                <form action="#">
                    <div class="campo">
                        <span class="material-icons">person</span>
                        <input type="email" id="iuser" required maxlength="30" placeholder="seu email">
                        <label for="iuser">email</label>
                    </div>
                    <div class="campo">
                        <span class="material-icons">vpn_key</span>
                        <input type="password" id="isenha" required maxlength="20" placeholder="sua senha">
                        <label for="isenha">senha</label>
                    </div>
                    <input type="submit" id="enviar">
                    <a href="#" class="botao">esqueci a senha <i class="material-icons">mail</i></a>
                </form>
                
            </div>
        </section>
    </main>
</body>
</html>
